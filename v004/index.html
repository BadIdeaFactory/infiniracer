<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>INFINI RACER</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" aria-hidden="true">
    <div class="row"><span class="lbl">SPD</span><span id="spd">000</span></div>
    <div class="row"><span class="lbl">DST</span><span id="dst">000000</span></div>
    <div class="row"><span class="lbl">BST</span><span id="bst">000000</span></div>
    <div class="bar"><div id="speedbar"></div></div>
  </div>

  <div id="overlay" class="overlay">
    <div class="title">
      <span class="g1">INFINI</span><span class="g2">RACER</span>
    </div>
    <div class="sub">[ vector / 1979 ]</div>
    <div class="ctrls">
      <p><kbd>↑</kbd>/<kbd>Q</kbd> THROTTLE &nbsp;&nbsp; <kbd>↓</kbd>/<kbd>A</kbd> BRAKE</p>
      <p><kbd>←</kbd>/<kbd>O</kbd> &nbsp; <kbd>→</kbd>/<kbd>P</kbd> &nbsp; STEER</p>
      <p class="ctrls-or">— OR DRAG THE JOYSTICK —</p>
    </div>
    <p class="hint">PRESS ANY KEY TO BEGIN</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
